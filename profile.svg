<?xml version="1.0" encoding="UTF-8"?>
<svg
    width="800"
    height="800"
    viewBox="0 0 800 800"
    xmlns="http://www.w3.org/2000/svg">

  <style>
    .bg {
      fill: #000000; /* Black background */
    }

    .line {
      fill: none;
      stroke: #ffffff; /* White outline for black background */
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 6s linear forwards;
    }

    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.8s; }
    .delay-3 { animation-delay: 1.6s; }
    .delay-4 { animation-delay: 2.4s; }
    .delay-5 { animation-delay: 3.2s; }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <!-- Black background -->
  <rect class="bg" x="0" y="0" width="800" height="800" />

  <!-- Replace these paths with your traced portrait paths -->
  <path class="line delay-1" d="M400 160 C340 160 300 210 300 280 C300 360 340 420 400 420 C460 420 500 360 500 280 C500 210 460 160 400 160 Z" />
  <path class="line delay-2" d="M360 420 L360 470 L300 560 L280 640 L520 640 L500 560 L440 470 L440 420" />
  <path class="line delay-3" d="M360 420 L340 470 L400 500 L460 470 L440 420" />
  <path class="line delay-4" d="M460 520 L520 520 L520 590 L460 590 Z" />
  <path class="line delay-4" d="M485 525 L495 585" />
  <path class="line delay-5" d="M360 270 C370 260 380 260 390 270" />
  <path class="line delay-5" d="M410 270 C420 260 430 260 440 270" />
  <path class="line delay-5" d="M380 320 C395 335 405 335 420 320" />

</svg>
